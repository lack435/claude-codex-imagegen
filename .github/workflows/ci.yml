name: CI

# Windows only by design: the server targets Windows and drives the Windows Codex CLI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No network, no model calls and no real Codex, so these run anywhere.
      - name: Tests
        run: cargo test

      # Via build.ps1 so CI exercises the same build definition a release uses, including
      # the --remap-path-prefix flags and its check that no home directory leaked in.
      - name: Build and verify
        shell: pwsh
        env:
          CODEX_IMAGEGEN_BUILD: ${{ github.sha }}
        run: .\build.ps1 -SkipChecks

      - name: Report what was built
        shell: pwsh
        run: '& ''.\dist\codex-imagegen.exe'' --version'

      # Every run leaves a downloadable binary, so the executable is obtainable from any
      # commit without building locally.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: codex-imagegen-${{ github.sha }}
          path: dist/codex-imagegen.exe
